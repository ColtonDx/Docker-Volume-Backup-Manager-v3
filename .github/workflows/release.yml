name: Release

# Publishes the Docker image when a version tag (e.g. v3.1.2) is pushed.
# Requires repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with Read & Write scope).

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: coltondx/docker-volume-backup-manager-v3

jobs:
  verify-version:
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with VERSION file
        id: check
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION (${file_version})"
            exit 1
          fi
          echo "version=${file_version}" >> "$GITHUB_OUTPUT"

  checks:
    name: CI checks
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, smoke test and push
    needs: [verify-version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dvbm:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name dvbm-smoke -p 127.0.0.1:8000:8000 \
            -e SSL_ENABLED=false \
            -e APP_PASSWORD=smoke-test-only \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            dvbm:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          reported="$(jq -r .version health.json)"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::Image reports version '${reported}', expected '${VERSION}'"
            docker logs dvbm-smoke
            exit 1
          fi
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          docker rm -f dvbm-smoke

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
