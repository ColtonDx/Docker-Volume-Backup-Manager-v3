# Development override — build from source instead of pulling the published image.
#
# Docker Compose reads docker-compose.yml and docker-compose.override.yml
# together by default, so on a checkout of this repository:
#
#     docker compose up --build
#
# builds the image from this working tree. Everything else (ports, volumes,
# environment, healthcheck) comes from docker-compose.yml, so there is only one
# place to change those.
#
# This file is committed deliberately: anyone testing a branch should be running
# their own code, not last release's image. Release tarballs and the compose
# snippet in the README do not include it, so end users still get the published
# image.
#
# To ignore this file and use the published image from a checkout:
#
#     docker compose -f docker-compose.yml up
#
# ── DOCKER_GID ────────────────────────────────────────────────────────────────
# The container runs as a non-root user that must be in a group matching the
# host's docker group, or it cannot read the mounted socket and every Docker
# operation fails. Set it once per machine:
#
#     echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" > .env
#
# Compose reads .env automatically. 999 is the common default and is used when
# the variable is unset.

services:
  docker-volume-backup-manager:
    build:
      context: .
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    # Distinguish locally built images from the published ones in `docker images`.
    image: docker-volume-backup-manager-v3:local
    environment:
      # ── Dev convenience: stable credentials across `docker compose down -v` ──
      #
      # Both read from .env, which is gitignored. Nothing secret is committed,
      # and both fall back to the safe production behaviour when unset:
      # APP_PASSWORD keeps the value from docker-compose.yml, and an empty
      # JWT_SECRET makes the app generate a random one and persist it to
      # /data/jwt_secret.
      #
      # Setting JWT_SECRET pins the token signing key so you stay logged in
      # after wiping the data volume. Generate your own — never share one
      # between machines, and never move a dev value to a real deployment:
      #
      #     {
      #       echo "DOCKER_GID=$(getent group docker | cut -d: -f3)"
      #       echo "JWT_SECRET=$(openssl rand -base64 32)"
      #       echo "APP_PASSWORD=pick-something"
      #     } > .env
      #
      # A value committed here would be public in git and would sign valid
      # admin tokens for every checkout of this repo, which is the exact
      # vulnerability the generated-secret behaviour exists to prevent.
      - JWT_SECRET=${JWT_SECRET:-}
      - APP_PASSWORD=${APP_PASSWORD:-changeme}

    # A source build is for development, so surface application logs rather
    # than the default json-file driver's silent accumulation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
